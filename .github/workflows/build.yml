name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем стабильный JDK 17, который требует Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ставим только чистые, необходимые для экосистемы утилиты
      - name: Install System Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk
          pip install --upgrade pip
          # Устанавливаем сам Flet и его официальный упаковщик
          pip install flet

      # Автоматически принимаем лицензии встроенного SDK гитхаба
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Собираем APK официальным методом Flet
      - name: Build Android APK
        run: |
          flet build apk --verbose

      # Выкачиваем готовый результат
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Clicker-APK
          path: build/apk/*.apk
          
