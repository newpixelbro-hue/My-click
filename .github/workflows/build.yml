name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config zlib1g-dev python3-dev autoconf cmake
          pip install --upgrade pip
          pip install python-for-android cython flet

      - name: Build APK via Python-for-Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Указываем современный Android 15 (API 35), чтобы он совпал с сервером
          p4a apk --private . \
            --package=org.pixel.clicker \
            --name="Pixel Clicker" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,flet \
            --arch=arm64-v8a \
            --android-api 35 \
            --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Clicker-APK
          path: "*.apk"
          
