name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Доставили mesa-utils для eglinfo, чтобы убрать ошибку драйвера
      - name: Install System Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev mesa-utils
          pip install --upgrade pip
          pip install flet

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Добавили флаг target, чтобы он собирал строго андроид и не лез в десктоп
      - name: Build Android APK
        run: |
          yes | flet build apk --target android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDesk-Game-APK
          path: build/apk/*.apk
          
