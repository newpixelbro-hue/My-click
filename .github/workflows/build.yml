name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Используем официальный, уже рабочий Android SDK от GitHub
      - name: Set up JDK 17 & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config zlib1g-dev python3-dev autoconf cmake
          pip install buildozer cython

      - name: Initialize and Configure Buildozer
        run: |
          buildozer init
          # Настраиваем Buildozer на использование системного Android SDK гитхаба
          sed -i 's/requirements = python3,kivy/requirements = python3,flet/g' buildozer.spec
          sed -i "s|# android.sdk_path =|android.sdk_path = $ANDROID_HOME|g" buildozer.spec
          sed -i "s|# android.ndk_path =|android.ndk_path = $ANDROID_NDK_LATEST_HOME|g" buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.pixel/g' buildozer.spec

      - name: Build with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Clicker-APK
          path: bin/*.apk
          
